<!-- Hero -->
<section class="page-hero">
  <div class="page-hero__inner max-w-screen-3xl mx-auto lg:px-desktop px-mobile">
    <nav class="page-hero__breadcrumb">
      <a routerLink="/" class="page-hero__bc-link">{{ 'header.nav.home' | translate }}</a>
      <span>/</span>
      <span>{{ 'gallery.title' | translate }}</span>
    </nav>
    <h1 class="page-hero__title">{{ 'gallery.title' | translate }}</h1>
    <p class="page-hero__sub">{{ 'gallery.subtitle' | translate }}</p>
  </div>
</section>

<!-- Meta bar -->
<div class="gp-meta">
  <div class="gp-meta__inner max-w-screen-3xl mx-auto lg:px-desktop px-mobile">
    <span class="gp-meta__count">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="16"
        height="16"
      >
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      12 {{ 'gallery.photos' | translate }}
    </span>
    <span class="gp-meta__hint">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="15"
        height="15"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
        <line x1="11" y1="8" x2="11" y2="14" />
        <line x1="8" y1="11" x2="14" y2="11" />
      </svg>
      {{ 'gallery.open' | translate }}
    </span>
  </div>
</div>

<!-- Gallery -->
<div class="gp-gallery">
  <app-gallery [showHeader]="false" [showViewAll]="false" />
</div>
