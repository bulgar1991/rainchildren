@switch (sport()) {
  @case ('football') {
    <svg class="scene scene--football" viewBox="0 0 400 240" aria-hidden="true">
      <defs>
        <pattern id="scene-net" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M10 0H0V10" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
        </pattern>
      </defs>

      <!-- Pitch -->
      <rect x="0" y="210" width="400" height="30" fill="#dcfce7" />
      <rect x="0" y="208" width="400" height="4" rx="2" fill="#86efac" />

      <!-- Goal -->
      <g class="fb-net">
        <rect x="306" y="116" width="74" height="94" fill="url(#scene-net)" />
      </g>
      <rect x="300" y="108" width="84" height="7" rx="3" fill="#ffffff" stroke="#94a3b8" />
      <rect x="300" y="108" width="7" height="102" rx="3" fill="#ffffff" stroke="#94a3b8" />
      <rect x="377" y="108" width="7" height="102" rx="3" fill="#ffffff" stroke="#94a3b8" />

      <!-- Kid -->
      <g class="fb-kid">
        <!-- back arm -->
        <line
          x1="82"
          y1="142"
          x2="70"
          y2="166"
          stroke="#f2c09a"
          stroke-width="7"
          stroke-linecap="round"
        />
        <!-- standing leg -->
        <line
          x1="86"
          y1="182"
          x2="84"
          y2="206"
          stroke="#f2c09a"
          stroke-width="8"
          stroke-linecap="round"
        />
        <ellipse cx="86" cy="208" rx="9" ry="4.5" fill="#1a2540" />
        <!-- kicking leg -->
        <g class="fb-leg">
          <line
            x1="98"
            y1="182"
            x2="98"
            y2="206"
            stroke="#f2c09a"
            stroke-width="8"
            stroke-linecap="round"
          />
          <ellipse cx="101" cy="208" rx="9" ry="4.5" fill="#1a2540" />
        </g>
        <rect x="78" y="172" width="26" height="14" rx="4" fill="#1a2540" />
        <rect x="76" y="134" width="30" height="42" rx="10" fill="#34d399" />
        <text x="91" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">
          7
        </text>
        <!-- front arm -->
        <line
          x1="100"
          y1="142"
          x2="112"
          y2="164"
          stroke="#f2c09a"
          stroke-width="7"
          stroke-linecap="round"
        />
        <circle cx="91" cy="118" r="15" fill="#f2c09a" />
        <path d="M76 116a15 15 0 0 1 30 0c-6-5-24-5-30 0z" fill="#3b2a20" />
        <circle cx="97" cy="118" r="1.8" fill="#1a2540" />
        <path
          d="M94 125q4 3 7 0"
          fill="none"
          stroke="#1a2540"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </g>

      <!-- Ball: X and Y move separately, so together they draw an arc -->
      <g class="fb-ball-x">
        <g class="fb-ball-y">
          <g class="fb-ball-spin">
            <circle cx="114" cy="202" r="8" fill="#ffffff" stroke="#1a2540" stroke-width="1.6" />
            <path d="M114 197l3.5 2.6-1.3 4.1h-4.4l-1.3-4.1z" fill="#1a2540" />
          </g>
        </g>
      </g>

      <!-- GOOL! -->
      <g class="scene__shout fb-shout">
        <text
          x="240"
          y="70"
          text-anchor="middle"
          font-size="34"
          font-weight="900"
          fill="#34d399"
          stroke="#ffffff"
          stroke-width="5"
          paint-order="stroke"
        >
          GOOL!
        </text>
      </g>
    </svg>
  }
  @case ('basketball') {
    <svg class="scene scene--basketball" viewBox="0 0 400 240" aria-hidden="true">
      <!-- Court -->
      <rect x="0" y="210" width="400" height="30" fill="#fde8d4" />
      <rect x="0" y="208" width="400" height="4" rx="2" fill="#fdba74" />

      <!-- Hoop -->
      <rect x="356" y="60" width="8" height="150" rx="3" fill="#94a3b8" />
      <rect
        x="342"
        y="40"
        width="8"
        height="70"
        rx="3"
        fill="#ffffff"
        stroke="#94a3b8"
        stroke-width="1.5"
      />
      <g class="bb-net">
        <path
          d="M302 97L308 126H334L340 97M309 97L314 126M316 97L318 126M324 97L322 126M332 97L328 126M305 108H337M307 118H335"
          fill="none"
          stroke="#cbd5e1"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </g>
      <g class="bb-rim">
        <rect x="300" y="93" width="44" height="5" rx="2.5" fill="#f97316" />
      </g>

      <!-- Player: X (run in) and Y (jump) move separately -->
      <g class="bb-player-x">
        <g class="bb-player-y">
          <g class="bb-leg bb-leg--back">
            <line
              x1="55"
              y1="184"
              x2="53"
              y2="206"
              stroke="#f2c09a"
              stroke-width="8"
              stroke-linecap="round"
            />
            <ellipse cx="56" cy="208" rx="9" ry="4.5" fill="#1a2540" />
          </g>
          <g class="bb-leg bb-leg--front">
            <line
              x1="66"
              y1="184"
              x2="66"
              y2="206"
              stroke="#f2c09a"
              stroke-width="8"
              stroke-linecap="round"
            />
            <ellipse cx="69" cy="208" rx="9" ry="4.5" fill="#1a2540" />
          </g>
          <rect x="48" y="172" width="26" height="15" rx="4" fill="#1a2540" />
          <line
            x1="52"
            y1="142"
            x2="40"
            y2="164"
            stroke="#f2c09a"
            stroke-width="7"
            stroke-linecap="round"
          />
          <rect x="46" y="134" width="30" height="42" rx="10" fill="#fb923c" />
          <text x="61" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">
            23
          </text>
          <circle cx="61" cy="118" r="15" fill="#f2c09a" />
          <path d="M46 116a15 15 0 0 1 30 0c-6-5-24-5-30 0z" fill="#3b2a20" />
          <circle cx="67" cy="118" r="1.8" fill="#1a2540" />
          <path
            d="M64 125q4 3 7 0"
            fill="none"
            stroke="#1a2540"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <!-- dunking arm, holding the ball -->
          <g class="bb-arm">
            <line
              x1="70"
              y1="142"
              x2="82"
              y2="166"
              stroke="#f2c09a"
              stroke-width="7"
              stroke-linecap="round"
            />
            <g class="bb-ball-held">
              <circle cx="85" cy="172" r="9" fill="#f97316" stroke="#7c2d12" stroke-width="1.4" />
              <path d="M76 172h18M85 163v18" stroke="#7c2d12" stroke-width="1.2" />
            </g>
          </g>
        </g>
      </g>

      <!-- Ball after the dunk: drops through the net and bounces -->
      <g class="bb-ball-drop">
        <circle cx="326" cy="104" r="9" fill="#f97316" stroke="#7c2d12" stroke-width="1.4" />
        <path d="M317 104h18M326 95v18" stroke="#7c2d12" stroke-width="1.2" />
      </g>

      <!-- DUNK! -->
      <g class="scene__shout bb-shout">
        <text
          x="190"
          y="62"
          text-anchor="middle"
          font-size="34"
          font-weight="900"
          fill="#fb923c"
          stroke="#ffffff"
          stroke-width="5"
          paint-order="stroke"
        >
          DUNK!
        </text>
      </g>
    </svg>
  }
  @case ('gymnastics') {
    <svg class="scene scene--gymnastics" viewBox="0 0 400 240" aria-hidden="true">
      <!-- Floor and mat -->
      <rect x="0" y="210" width="400" height="30" fill="#ede9fe" />
      <rect x="30" y="202" width="340" height="10" rx="5" fill="#c4b5fd" />
      <path d="M115 202v10M200 202v10M285 202v10" stroke="#a78bfa" stroke-width="1.5" />

      <!-- Gymnast: X (run + flight), Y (jump), spin (the flip) and squash (take-off / landing) -->
      <g class="gy-x">
        <g class="gy-y">
          <g class="gy-spin">
            <g class="gy-squash">
              <g class="gy-leg gy-leg--back">
                <line
                  x1="64"
                  y1="182"
                  x2="63"
                  y2="200"
                  stroke="#f2c09a"
                  stroke-width="8"
                  stroke-linecap="round"
                />
                <ellipse cx="65" cy="202" rx="7" ry="3.5" fill="#f2c09a" />
              </g>
              <g class="gy-leg gy-leg--front">
                <line
                  x1="76"
                  y1="182"
                  x2="77"
                  y2="200"
                  stroke="#f2c09a"
                  stroke-width="8"
                  stroke-linecap="round"
                />
                <ellipse cx="79" cy="202" rx="7" ry="3.5" fill="#f2c09a" />
              </g>
              <g class="gy-arm gy-arm--back">
                <line
                  x1="58"
                  y1="142"
                  x2="48"
                  y2="166"
                  stroke="#f2c09a"
                  stroke-width="7"
                  stroke-linecap="round"
                />
              </g>
              <!-- leotard -->
              <path
                d="M56 144a10 10 0 0 1 10-10h8a10 10 0 0 1 10 10v26l-6 14H62l-6-14z"
                fill="#a78bfa"
              />
              <path d="M58 158h24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
              <circle cx="70" cy="118" r="15" fill="#f2c09a" />
              <path d="M55 116a15 15 0 0 1 30 0c-6-5-24-5-30 0z" fill="#3b2a20" />
              <circle cx="57" cy="108" r="6" fill="#3b2a20" />
              <circle cx="76" cy="118" r="1.8" fill="#1a2540" />
              <path
                d="M73 125q4 3 7 0"
                fill="none"
                stroke="#1a2540"
                stroke-width="1.6"
                stroke-linecap="round"
              />
              <g class="gy-arm gy-arm--front">
                <line
                  x1="82"
                  y1="142"
                  x2="92"
                  y2="166"
                  stroke="#f2c09a"
                  stroke-width="7"
                  stroke-linecap="round"
                />
              </g>
            </g>
          </g>
        </g>
      </g>

      <!-- Sparkles around the landing -->
      <g class="gy-stars" fill="#facc15">
        <path class="gy-star gy-star--1" d="M262 112l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" />
        <path class="gy-star gy-star--2" d="M342 96l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" />
        <path class="gy-star gy-star--3" d="M352 150l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" />
      </g>

      <!-- BRAVO! -->
      <g class="scene__shout gy-shout">
        <text
          x="200"
          y="62"
          text-anchor="middle"
          font-size="34"
          font-weight="900"
          fill="#a78bfa"
          stroke="#ffffff"
          stroke-width="5"
          paint-order="stroke"
        >
          BRAVO!
        </text>
      </g>
    </svg>
  }
}
