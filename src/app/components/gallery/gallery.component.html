<section class="gallery">
  <div class="max-w-screen-3xl mx-auto lg:px-desktop px-mobile">
    @if (showHeader) {
      <div class="gallery__header">
        <div class="gallery__header-top">
          <h2 class="gallery__title">{{ 'gallery.title' | translate }}</h2>
          @if (showViewAll) {
            <a routerLink="/gallery" class="gallery__view-all">
              {{ 'gallery.viewAll' | translate }}
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </a>
          }
        </div>
        <p class="gallery__subtitle">{{ 'gallery.subtitle' | translate }}</p>
      </div>
    }

    <div class="gallery__grid">
      @for (img of visible; track img.id; let i = $index) {
        <button
          class="gallery__item"
          (click)="open(i)"
          [attr.aria-label]="'gallery.open' | translate"
        >
          <img [src]="img.src" [alt]="img.alt | translate" class="gallery__img" loading="lazy" />
          <div class="gallery__overlay">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="28"
              height="28"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
              <line x1="11" y1="8" x2="11" y2="14" />
              <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </div>
        </button>
      }
    </div>
  </div>
</section>

<!-- Lightbox -->
@if (active) {
  <div
    class="lightbox"
    role="presentation"
    (click)="close()"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <button class="lightbox__close" (click)="close()" aria-label="Close">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        width="22"
        height="22"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <button
      class="lightbox__arrow lightbox__arrow--prev"
      (click)="$event.stopPropagation(); prev()"
      aria-label="Previous"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
      >
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>

    <div class="lightbox__img-wrap" role="presentation" (click)="$event.stopPropagation()">
      <img [src]="active.src" [alt]="active.alt | translate" class="lightbox__img" />
    </div>

    <button
      class="lightbox__arrow lightbox__arrow--next"
      (click)="$event.stopPropagation(); next()"
      aria-label="Next"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
      >
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>

    <span class="lightbox__counter">{{ (activeIndex() ?? 0) + 1 }} / {{ visible.length }}</span>
  </div>
}
